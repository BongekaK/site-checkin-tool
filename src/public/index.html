<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Visit Check-In</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
        h1 { color: #0f172a; margin-bottom: 0.5rem; }
        p { color: #64748b; margin-bottom: 2rem; }
        .grid { display: grid; gap: 2rem; grid-template-columns: 1fr; }
        @media (min-width: 768px) { .grid { grid-template-columns: 350px 1fr; } }
        .card { background: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; }
        .form-control { width: 100%; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 4px; box-sizing: border-box; }
        .btn { display: inline-block; width: 100%; padding: 0.625rem; font-weight: 600; border-radius: 4px; border: none; cursor: pointer; text-align: center; }
        .btn-primary { background: #0284c7; color: #fff; }
        .btn-secondary { background: #cbd5e1; color: #1e293b; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 1rem; background: #f1f5f9; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; align-items: flex-end; }
        .filter-group { flex: 1 1 150px; }
        .filter-buttons { display: flex; gap: 0.5rem; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; }
        .badge { padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; display: inline-block; text-transform: uppercase; }
        .badge-completed { background: #dcfce7; color: #15803d; }
        .badge-issue { background: #fee2e2; color: #b91c1c; }
        #toast { position: fixed; bottom: 1rem; right: 1rem; padding: 0.75rem 1.5rem; border-radius: 4px; color: #fff; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Site Visit Check-In</h1>
    <p>Field technician site visit logging and management tool</p>
    <div class="grid">
        <div class="card">
            <h2 style="margin-bottom: 1rem; font-size: 1.25rem;">Log a New Visit</h2>
            <form id="visitForm">
                <div class="form-group">
                    <label for="site_name">Site Name</label>
                    <input type="text" id="site_name" class="form-control" placeholder="e.g. Headquarters" required>
                </div>
                <div class="form-group">
                    <label for="technician_name">Technician Name</label>
                    <input type="text" id="technician_name" class="form-control" placeholder="e.g. Jane Doe" required>
                </div>
                <div class="form-group">
                    <label for="visit_datetime">Date & Time</label>
                    <input type="datetime-local" id="visit_datetime" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" class="form-control" required>
                        <option value="" disabled selected>Select Status</option>
                        <option value="completed">completed</option>
                        <option value="issue found">issue found</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="notes">Notes (Optional)</label>
                    <textarea id="notes" class="form-control" rows="3" placeholder="Visit details..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit Check-In</button>
            </form>
        </div>
        <div>
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="filter_site" style="font-size: 0.8rem; font-weight: 600;">Filter by Site</label>
                    <input type="text" id="filter_site" class="form-control" placeholder="Search site...">
                </div>
                <div class="filter-group">
                    <label for="filter_start" style="font-size: 0.8rem; font-weight: 600;">Start Date</label>
                    <input type="date" id="filter_start" class="form-control">
                </div>
                <div class="filter-group">
                    <label for="filter_end" style="font-size: 0.8rem; font-weight: 600;">End Date</label>
                    <input type="date" id="filter_end" class="form-control">
                </div>
                <div class="filter-buttons">
                    <button id="btnFilter" class="btn btn-primary" style="padding: 0.5rem 1rem;">Filter</button>
                    <button id="btnReset" class="btn btn-secondary" style="padding: 0.5rem 1rem;">Reset</button>
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Site Name</th>
                            <th>Technician</th>
                            <th>Visit Time</th>
                            <th>Status</th>
                            <th>Notes</th>
                        </tr>
                    </thead>
                    <tbody id="visitsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="toast"></div>
    <script src="app.js"></script>
</body>
</html>
